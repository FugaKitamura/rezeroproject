{% extends 'base.html' %}
{% load static %}
{% block title %}リゼロ 考察 投稿{% endblock %}

      {% block header %}
      <header class="masthead" style="background-image: url({% static 'assets/img/p.png' %})">
          <div class="container position-relative px-4 px-lg-5">
              <div class="row gx-4 gx-lg-5 justify-content-center">
                  <div class="col-md-10 col-lg-8 col-xl-7">
                         <div class="site-heading" style="color: black; text-shadow: 0px 0px 20px white;">
                            <h3>POST</h3>
                            <h1>投稿</h1>
                        </div>
                  </div>
              </div>
          </div>
      </header>
      {% endblock %}

      {% block contents %}
      <br>
      <div class="container">
        <div class="row">
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
              <tr>
                <th>カテゴリー</th>
                <td>{{ form.category }}</td>
              </tr>
              <tr>
                <th>タイトル</th>
                <td>{{ form.title }}</td>
              </tr>
              <tr>
                <th>考察本文</th>
                <td>{{ form.content }}</td>
              </tr>
            </table>
            <button type="submit" class="btn" style="margin-bottom: 30px; margin-top: 20px; background-color: #db3fa7;">投稿する</button>
          </form>        
        </dv>
      </dv>
      {% endblock %}
